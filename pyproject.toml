[project]
name = "context-fabric"
version = "0.1.0"
description = "Context Fabric — semantic MMU / context compiler for AI agents (CPP v1.0)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "tiktoken>=0.7",
    "httpx>=0.27",
    "cryptography>=43",
]

[project.scripts]
cfx = "sidecar.cli:main"

[project.optional-dependencies]
observability = ["opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25"]
embeddings = ["fastembed>=0.4"]
langgraph = ["langgraph>=1.2.16"]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["protocol", "kernel", "sidecar", "adapters"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

# Optional extras: type-check must pass whether or not they are installed.
[[tool.mypy.overrides]]
module = ["fastembed", "fastembed.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["langgraph", "langgraph.*"]
follow_imports = "skip"
ignore_missing_imports = true

# B8 live harness deps: installed only in the WSL2 agent/grader venv, never on Windows.
[[tool.mypy.overrides]]
module = ["minisweagent", "minisweagent.*", "swebench", "swebench.*", "datasets", "datasets.*", "litellm", "litellm.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Synthetic corpus notes are long single-line string literals by design.
"evals/recall_bench.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

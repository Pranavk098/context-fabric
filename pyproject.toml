[project]
name = "context-fabric"
version = "0.1.0"
description = "Context Fabric — semantic MMU / context compiler for AI agents (CPP v1.0)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "tiktoken>=0.7",
    "httpx>=0.27",
    "cryptography>=43",
]

[project.optional-dependencies]
observability = ["opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25"]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["protocol", "evals"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

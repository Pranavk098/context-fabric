name: release

# Runs only when a version tag is pushed. Builds the package, writes SHA256SUMS, records a signed
# build-provenance attestation (Sigstore, via GitHub), and creates the GitHub Release.
# Tags containing "-" (for example v0.1.0-alpha.1) are published as pre-releases.

on:
  push:
    tags: ["v*"]
  # Manual dry run: build, checksum and inspect the artifacts; never publishes.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check only (manual runs never publish)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release
      id-token: write       # Sigstore signing for the attestation
      attestations: write   # store the attestation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0      # full history so the tag-as-ancestor check can run
      - name: Verify the tag is on main
        if: github.event_name == 'push'
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "0.11.3"
      - name: Test gates
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy protocol evals kernel sidecar adapters cfxd
          uv run pytest -q
          uv run python scripts/check_docs_numbers.py
      - name: Build sdist and wheel
        run: uv build
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$' \
            || { echo "release: invalid tag '$TAG'" >&2; exit 1; }
          notes="docs/release-notes/${TAG}.md"
          if [ -f "$notes" ]; then notes_arg="--notes-file $notes"; else notes_arg="--generate-notes"; fi
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" dist/* --title "$TAG" $notes_arg $flags

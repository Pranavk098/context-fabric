name: release

# Runs only when a version tag is pushed. Builds the package, writes SHA256SUMS, records a signed
# build-provenance attestation (Sigstore, via GitHub), and creates the GitHub Release.
# Tags containing "-" (for example v0.1.0-alpha.1) are published as pre-releases.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release
      id-token: write       # Sigstore signing for the attestation
      attestations: write   # store the attestation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - name: Build sdist and wheel
        run: uv build
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="docs/release-notes/${TAG}.md"
          [ -f "$notes" ] || { printf 'Release %s. See CHANGELOG.md.\n' "$TAG" > "$notes"; }
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" dist/* --title "$TAG" --notes-file "$notes" $flags

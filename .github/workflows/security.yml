name: security

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "0.11.3"
      - name: Bandit
        run: uvx bandit -r cfxd -ll -q -b .bandit-allow
      - name: Export locked requirements
        run: uv export --locked --no-hashes --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/requirements.txt"
      - name: pip-audit
        run: uvx pip-audit -r "$RUNNER_TEMP/requirements.txt"

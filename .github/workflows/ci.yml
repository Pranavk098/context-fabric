name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - name: Sync environment
        run: uv sync --extra langgraph --python 3.12
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy protocol evals kernel sidecar adapters
      - name: Tests
        run: uv run pytest -q
      - name: Docs numbers
        run: uv run python scripts/check_docs_numbers.py
      - name: Deterministic-core spike
        run: uv run python -m evals.spike_deterministic

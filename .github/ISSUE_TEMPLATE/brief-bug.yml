name: Brief bug report
description: Brief, a sub-agent handoff or `cfxd brief` broke, errored or behaved oddly
labels: ["bug", "brief"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying the alpha. Please do not paste prompts, file paths, commands, brief text
        or secrets. Describe one handoff in words. Vulnerability reports belong in the private
        channel linked on the new-issue page, not here.
  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: macOS 15.2, Ubuntu 24.04, Windows 11
    validations:
      required: true
  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
      description: The output of `claude --version`.
    validations:
      required: true
  - type: input
    id: cfxd-version
    attributes:
      label: cfxd version
      description: The first line of `cfxd week --share`, for example `cfxd week 0.1.1a1`.
    validations:
      required: true
  - type: checkboxes
    id: switches
    attributes:
      label: Switches that were on
      options:
        - label: brief
        - label: brief_v1
        - label: carry_back
        - label: other (say which below)
  - type: textarea
    id: doctor
    attributes:
      label: cfxd doctor output
      description: Paste the whole block.
      render: text
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Counts only.
    validations:
      required: true
  - type: textarea
    id: handoff
    attributes:
      label: The handoff, in words
      description: Sub-agent type, target model and packet size from `cfxd brief`, the re-read and outcome lines, and any `unmatched` reason. No file paths.
  - type: dropdown
    id: repeatable
    attributes:
      label: Does it stop when you run `cfxd set brief_v1 off`?
      options:
        - "Yes"
        - "No"
        - Not tried
  - type: textarea
    id: share-output
    attributes:
      label: cfxd week --share output
      description: Paste the whole block. It contains counts, sizes and model ids only.
      render: text
  - type: checkboxes
    id: safe-output
    attributes:
      label: Safe to share
      options:
        - label: I pasted only `--share` output or counts, no prompts, paths or commands
          required: true
